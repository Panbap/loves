    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Playpen Sans", cursive;
            background-color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        img {
            width: 250px;
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }

        h2 {
            font-size: 32px;
            font-family: "Playpen Sans", cursive;
            font-weight: 700;
            color: #ff8282;
            text-shadow: 1px 1px 0 #e4e4e4;
            margin-bottom: 30px;
            text-align: center;
            transition: all 0.5s ease;
            text-shadow:
                1px 1px 0 #e4e4e4,
                2px 2px 0 #e4e4e4;
        }

        h2:hover {
            transform: perspective(400px) translateZ(10px) scale(1.05);
        }

        .button-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        button {
            font-family: "Playpen Sans", cursive;
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 25px;
            color: #ef9a9a;
            font-weight: 600;
        }

        #yesBtn {
            background: linear-gradient(#fff);
            box-shadow: 0 2px 5px #ef9a9a;
            border: 2px solid #ef9a9a;
            animation: jump 3s ease-in-out infinite;
        }

        #noBtn {
            background: linear-gradient(#fff);
            box-shadow: 0 2px 5px #ef9a9a;
            border: 2px solid #ef9a9a;
            transition: left 0.2s ease, top 0.2s ease;
        }

        @keyframes jump {

            0%,
            25%,
            75%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 24px;
            animation: flyUp 3s linear forwards;
            pointer-events: none;
            color: #ffa3a3;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
