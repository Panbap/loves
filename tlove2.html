    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Mali", cursive;
        }

        body {
            overflow: hidden;
            background: radial-gradient(circle at center, #0f0c29 0%, #06051f 60%, #000000 100%);
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .message {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            color: #fff;
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            opacity: 0;
            animation: fadeInMessage 1s ease-in-out 1s forwards;
        }

        .subtitle {
            font-size: clamp(12px, 2vw, 16px);
            margin-top: 10px;
            color: #bbb;
            font-style: italic;
        }

        @keyframes fadeInMessage {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
